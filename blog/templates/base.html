<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Journal{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #faf9f6;
            --surface: #ffffff;
            --surface2: #f4f2ee;
            --accent: #2a6049;
            --accent-light: #e8f0ec;
            --accent2: #c4503a;
            --text: #1a1a18;
            --muted: #8a8880;
            --border: #e5e3de;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
            --shadow-hover: 0 4px 8px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.08);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }

        /* ── NAVBAR ── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250,249,246,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .nav-logo {
            font-family: 'Fraunces', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.01em;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: color 0.2s;
            font-weight: 400;
        }

        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        /* Search form in nav */
        .nav-search {
            display: flex;
            align-items: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.3rem 0.75rem;
            gap: 0.4rem;
        }

        .nav-search input {
            background: none;
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            color: var(--text);
            width: 140px;
        }

        .nav-search input::placeholder { color: var(--muted); }

        .nav-search button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.9rem;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .nav-search button:hover { color: var(--accent); }

        /* ── PAGE WRAPPER ── */
        .page { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }

        /* ── FOOTER ── */
        footer {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 2.5rem 2rem;
            margin-top: 4rem;
        }

        .footer-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-brand {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .footer-links a {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .footer-links a:hover { color: var(--text); }

        .footer-copy {
            color: var(--muted);
            font-size: 0.78rem;
        }

        /* ── SHARED COMPONENTS ── */
        .tag-pill {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.2rem 0.65rem;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .tag-pill:hover { background: var(--accent); color: white; }

        .category-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            padding: 0.65rem 1.4rem;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover { background: #1f4d38; }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .animate { animation: fadeUp 0.6s ease both; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.2s; }
        .delay-5 { animation-delay: 0.25s; }

        @media (max-width: 700px) {
            nav { padding: 0 1rem; }
            .nav-search { display: none; }
            .nav-links { gap: 1rem; }
            .page { padding: 2rem 1rem; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
    <a class="nav-logo" href="{% url 'home' %}">The Journal</a>
    <div class="nav-right">
        <form class="nav-search" method="GET" action="{% url 'home' %}">
            <button type="submit">🔍</button>
            <input type="text" name="q" placeholder="Search posts…" value="{{ request.GET.q }}">
        </form>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a></li>
            <li><a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>About</a></li>
            <li><a href="{% url 'contact' %}" {% if request.resolver_match.url_name == 'contact' %}class="active"{% endif %}>Contact</a></li>
            <li><a href="/admin">Admin</a></li>
        </ul>
    </div>
</nav>

{% block content %}{% endblock %}

<footer>
    <div class="footer-inner">
        <span class="footer-brand">The Journal</span>
        <ul class="footer-links">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
        <span class="footer-copy">© {% now "Y" %} · Built with Django</span>
    </div>
</footer>

</body>
</html>
